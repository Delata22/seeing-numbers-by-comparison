[project]
name = "seeing-numbers-by-comparison"
version = "0.1.0"
description = "A number line, addition and subtraction learned only from more / same / fewer judgments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11.0",
    "numpy",
    "pillow",
    "matplotlib",
    "scikit-learn",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
